<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page Application routing support for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Redirect to index.html with path preserved
      var path = window.location.pathname
      var query = window.location.search
      var hash = window.location.hash
      
      // Store the current path for restoration after redirect
      sessionStorage.redirect = path + query + hash
      
      // Redirect to index.html (GitHub Pages will serve this from root)
      window.location.replace('/')
    </script>
  </body>
</html>
