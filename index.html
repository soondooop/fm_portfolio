<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Kim Seungdo — 웹 퍼블리셔 / 프론트엔드 포트폴리오"
    />
    <script>
      (function () {
        try {
          var key = 'fm-portfolio-theme'
          var pref = localStorage.getItem(key) || 'system'
          var light = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme =
            pref === 'light' || pref === 'dark'
              ? pref
              : light
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.601/neodgm/style.css"
    />
